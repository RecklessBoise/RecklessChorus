name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            configure: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            pluginval: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: Windows
            os: windows-latest
            configure: ""
            pluginval: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: pluginval (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pv.zip
          ${{ matrix.pluginval_bin }} --strictness-level 10 --validate-in-process --skip-gui-tests \
            --timeout-ms 600000 "build/RecklessChorus_artefacts/Release/VST3/RecklessChorus.vst3"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cd build/RecklessChorus_artefacts/Release
          ditto -c -k --keepParent VST3/RecklessChorus.vst3 "$GITHUB_WORKSPACE/dist/RecklessChorus-macOS-VST3.zip"
          ditto -c -k --keepParent AU/RecklessChorus.component "$GITHUB_WORKSPACE/dist/RecklessChorus-macOS-AU.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/RecklessChorus_artefacts/Release/VST3/RecklessChorus.vst3 `
                           -DestinationPath dist/RecklessChorus-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RecklessChorus-${{ matrix.name }}
          path: dist/*.zip

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
